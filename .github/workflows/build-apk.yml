name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 دریافت کدهای ریپازیتوری (Checkout Code)
        uses: actions/checkout@v4

      - name: ☕ راه‌اندازی جاوا ۱۷ (Set up JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: ⚡ راه‌اندازی نود جی‌اس (Set up Node.js)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 نصب وابستگی‌های پروژه (Install npm packages)
        run: npm ci

      - name: 🔨 بیلد برنامه وب (Build Web App)
        run: npm run build

      - name: 🔄 همگام‌سازی کپسیتور با اندروید (Capacitor Sync Android)
        run: npx cap sync android

      - name: 🛡️ تنظیم مجوز اجرایی گرادل (Chmod gradlew)
        run: chmod +x android/gradlew

      - name: 📱 کامپایل و تولید فایل APK اندروید (Assemble Debug APK)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 🚀 آپلود فایل APK در آرتیفکت‌های گیت‌هاب (Upload APK Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PsychoTests-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
